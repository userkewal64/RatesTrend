<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link href="style.css" rel="stylesheet"/>
</head>
<body>

    <div class="container">
        <h2>Currency Converter</h2>

        <div class="field">
            <label for="amount">Amount</label>
            <input type="number" id="amount" name="amount" value="100" min="0">
        </div>

        <div class="currencies">
            <div class="field">
                <label for="from">From</label>
                <div class="currency-picker" id="from-picker">
                    <div class="picker-control">
                        <span class="picker-flag-slot" aria-hidden="true"></span>
                        <input id="from" name="from" type="text" placeholder="Select a currency"
                            role="combobox" aria-autocomplete="list" aria-expanded="false"
                            aria-controls="from-options" autocomplete="off">
                    </div>
                    <ul class="picker-options" id="from-options" role="listbox" hidden></ul>
                </div>
            </div>

            <div class="field">
                <label for="to">To</label>
                <div class="currency-picker" id="to-picker">
                    <div class="picker-control">
                        <span class="picker-flag-slot" aria-hidden="true"></span>
                        <input id="to" name="to" type="text" placeholder="Select a currency"
                            role="combobox" aria-autocomplete="list" aria-expanded="false"
                            aria-controls="to-options" autocomplete="off">
                    </div>
                    <ul class="picker-options" id="to-options" role="listbox" hidden></ul>
                </div>
            </div>
        </div>


        <button id="convert">Convert</button><br><br>
        <button id="swap" type="button" title="Swap currencies">⇄</button>


        <h3 id="result"></h3><br>
        <p id="rate-info"></p>

    </div>

    <script src="script.js"></script>
</body>
</html>
